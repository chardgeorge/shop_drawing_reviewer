name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop_drawing_reviewer_test
          POSTGRES_USER: shop_reviewer
          POSTGRES_PASSWORD: local_prototype_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_reviewer -d shop_drawing_reviewer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shop_reviewer:local_prototype_only@localhost:5432/shop_drawing_reviewer_test
      TEST_DATABASE_URL: postgresql://shop_reviewer:local_prototype_only@localhost:5432/shop_drawing_reviewer_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: python -m app.migrate
      - run: pytest
