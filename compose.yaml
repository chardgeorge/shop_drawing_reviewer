services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop_drawing_reviewer
      POSTGRES_USER: shop_reviewer
      POSTGRES_PASSWORD: local_prototype_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_reviewer -d shop_drawing_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
